<!DOCTYPE html>
<!-- Source for the share preview images (1200x630), one per language:
     public/og-image.png (zh), og-image-ja.png, og-image-en.png. Pick the language
     with ?lang=ja|en and regenerate with headless Chrome/Edge (commands in README).
     The chart is decorative and the card shows no live rate, so it never goes stale. -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: "Google Sans Flex"; font-weight: 300 800; src: url(../public/vendor/fonts/google-sans-flex-ascii.woff2) format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #fef7ff;
    color: #1d1b20;
    font-family: "Google Sans Flex", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  /* Han characters in Japanese need Japanese fonts. */
  html:lang(ja) body {
    font-family: "Google Sans Flex", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, "Noto Sans JP", sans-serif;
    font-variation-settings: "ROND" 100;
  }
  .card {
    position: absolute;
    inset: 48px;
    border-radius: 36px;
    background: #f3edf7;
    overflow: hidden;
  }
  .chart { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 300px; }
  .content { position: absolute; left: 72px; top: 64px; right: 72px; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand svg { width: 64px; height: 64px; }
  .brand span { font-size: 30px; font-weight: 500; color: #49454f; letter-spacing: .04em; }
  h1 { margin: 40px 0 0; font-size: 84px; font-weight: 700; line-height: 1.1; letter-spacing: .02em; color: #1d1b20; }
  .pair { margin-top: 22px; font: 600 52px/1 "Google Sans Flex", sans-serif; font-variation-settings: "ROND" 100; }
  .pair .jpy { color: #286092; }
  .pair .cny { color: #a43b31; }
  .pair .arrow { color: #6750a4; margin: 0 14px; }
  .tags { margin-top: 30px; font-size: 28px; color: #49454f; letter-spacing: .04em; }
  .domain {
    position: absolute; right: 72px; bottom: 56px;
    padding: 12px 26px; border-radius: 999px;
    background: #6750a4; color: #fff;
    font: 600 26px/1 "Google Sans Flex", sans-serif; letter-spacing: .02em;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="chart" viewBox="0 0 1104 300" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6750a4" stop-opacity=".22" />
          <stop offset="1" stop-color="#6750a4" stop-opacity="0" />
        </linearGradient>
      </defs>
      <path d="M0 274 L70 268 L140 276 L210 261 L280 265 L350 248 L420 255 L490 238 L560 246 L630 230 L700 238 L770 223 L840 233 L910 218 L980 225 L1050 212 L1104 215 L1104 300 L0 300 Z" fill="url(#fill)" />
      <path d="M0 274 L70 268 L140 276 L210 261 L280 265 L350 248 L420 255 L490 238 L560 246 L630 230 L700 238 L770 223 L840 233 L910 218 L980 225 L1050 212 L1104 215" fill="none" stroke="#6750a4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity=".55" />
    </svg>
    <div class="content">
      <div class="brand">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect width="48" height="48" rx="12" fill="#6750a4" />
          <path d="M15 11l9 12 9-12M24 23v15M16 26h16M16 32h16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span id="brand">汇率板</span>
      </div>
      <h1 id="title">日元人民币汇率</h1>
      <div class="pair"><span class="jpy">JPY</span><span class="arrow">⇄</span><span class="cny">CNY</span></div>
      <div class="tags" id="tags">每日参考汇率 · 换算计算器 · 历史走势</div>
    </div>
    <div class="domain">rate.anontokyo.vip</div>
  </div>
<script>
  // Same names as public/i18n.js (app.title) and worker.js (PAGE_META).
  const TEXT = {
    ja: { lang: "ja", brand: "レートボード", title: "円・人民元レート", tags: "毎日の参照レート · 通貨換算 · レートの推移" },
    en: { lang: "en", brand: "Rate Board", title: "Yen–Yuan Rate", tags: "Daily reference rate · Converter · History" },
  };
  const text = TEXT[new URLSearchParams(location.search).get("lang")];
  if (text) {
    document.documentElement.lang = text.lang;
    for (const key of ["brand", "title", "tags"]) document.getElementById(key).textContent = text[key];
  }
</script>
</body>
</html>
